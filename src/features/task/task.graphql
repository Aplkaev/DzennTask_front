fragment TaskFields on Task {
  id
  title
  description
  status
  priority
  project {
    id
  }
  assigned_to {
    id
    email
  }
}

# status / status_list — значения из БД в нижнем регистре ('new', 'done'),
# а не имена enum TaskStatusEnum ('NEW', 'DONE').
query Tasks(
  $project: String!
  $status_list: [String]
  $title: String
  $order: [TaskFilter_order]
  $first: Int
) {
  tasks(
    project: $project
    status_list: $status_list
    title: $title
    order: $order
    first: $first
  ) {
    edges {
      node {
        ...TaskFields
      }
    }
  }
}

mutation CreateTask($input: createTaskInput!) {
  createTask(input: $input) {
    task {
      ...TaskFields
    }
  }
}

mutation UpdateTask($input: updateTaskInput!) {
  updateTask(input: $input) {
    task {
      ...TaskFields
    }
  }
}

mutation DeleteTask($input: deleteTaskInput!) {
  deleteTask(input: $input) {
    task {
      id
    }
  }
}
